# Actuator module reference data for robot_oscbf.
# These values are hardware references and the single source of truth for the
# current simulation/shadow velocity profile.  J1 remains simulation-only
# until its linear transmission and braking capability are measured.

joint_module_mapping:
  J1:
    joint_type: prismatic
    module: B06-PA-36-G
    note: "Requires linear transmission ratio before deriving m/s or N limits."
  J2:
    joint_type: revolute
    module: B25-PD-36-G
  J3:
    joint_type: revolute
    module: B25-PD-36-G
  J4:
    joint_type: revolute
    module: B25-PD-36-G
  J5:
    joint_type: revolute
    module: B25-PD-36-G
