# The controller reads this section through work/actuator_limits.py.  Rotary
# velocity limits are derived from the rated output speed, not copied into
# individual controller modules.  Acceleration values remain simulation
# assumptions until reflected inertia, payload and driver current limits are
# calibrated on hardware.
control_limit_profile:
  schema_version: 1
  rated_speed_safety_factor: 0.70
  J1:
    simulation_velocity_limit_m_s: 0.50
    simulation_acceleration_limit_m_s2: 5.0
    hardware_validated: false
    note: "Linear transmission ratio/screw lead is missing; never use this as a hardware limit."
  revolute_simulation_acceleration_limit_rad_s2: 31.4

constraint_notes:
  legacy_python_dq_max:
    J1_m_s: 0.5
    J2_to_J9_rad_s: 3.14
    note: "Historical value only. Runtime limits are derived from control_limit_profile."
  cpp_conservative_dq_max:
    J1_m_s: 0.30
    J2_to_J9_rad_s: 1.5
  required_before_hardware_enforcement:
    - J1 linear transmission ratio or screw lead
    - joint-side reflected inertia
    - controller current limit behavior
    - CAN control period and measured latency
    - payload and link mass properties
    - thermal derating curve
