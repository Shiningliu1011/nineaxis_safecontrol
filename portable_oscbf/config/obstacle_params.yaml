obstacles:
  - name: sphere_0
    type: sphere
    center: [1.1, 0.2, 0.15]
    radius: 0.18
    safety_margin: 0.08

# 注意: 默认值的权威源是 work/perception_config.py 的 PointCloudCollisionConfig。
# YAML 中省略的字段会回退到 dataclass 默认值。
point_cloud_collision:
  enabled: true
  # 注意: 驱动 depth_registration:=true 时, 彩色对齐点云 frame 是
  # camera_color_optical_frame (不是 camera_depth_optical_frame)。
  input_frame: camera_color_optical_frame
  # 世界系 (固定环境系, 非机器人本体系)。
  # 生产环境必须设为 odom 或 map (不动的固定系); base_link 会随机器人移动,
  # 仅用于仿真占位, 不得用于生产部署。
  # 相机→world 的 4x4 变换由 camera_to_world_static 提供 (标定后换成 TF + use_tf: true)。
  world_frame: base_link
  # 驱动只发布 depth/points 与 depth_registered/points (彩色对齐), 无 depth/color/points。
  source_topic: /camera/depth_registered/points
  # LiDAR (留空则不订阅, 向后兼容)
  source_topic_lidar: ""
  input_frame_lidar: ""
  # 各传感器源体素降采样 (米)
  source_voxel_camera_m: 0.02
  source_voxel_lidar_m: 0.03
  # 融合后体素尺寸 (米)
  fusion_voxel_m: 0.03
  # 跨传感器时间差阈值 (秒)
  max_inter_sensor_dt_s: 0.1
  # 各传感器最大延迟 (秒)
  camera_max_age_s: 0.5
  lidar_max_age_s: 0.5
  # 占据超时 / 静态确认 / 感知有效超时 (秒)
  occupancy_timeout_s: 0.3
  static_confirm_s: 0.5
  perception_timeout_s: 1.0
  voxel_size: 0.03
  max_points: 5000
  point_radius: 0.01
  safety_margin: 0.08

# ESDF 栅格范围 (world_frame = base_link 系)。
# 必须覆盖机械臂全身碰撞球体 (基座球心 z≈-0.26, 轨迹扫掠 x±0.53, y 0~0.57,
# z -0.3~1.54), 否则采样越界返回 OUT_OF_GRID_DISTANCE=-1 → CBF 约束永远违反
# → 进给率被限到 0。shape = (55, 35, 88) @ voxel 0.03。
workspace:
  min: [-0.9, -0.2, -0.6]
  max: [ 0.9,  0.8,  2.0]
