# Joint limits aligned with RobotModel::makeDefaultParameters() (C++ authoritative).
# J1: prismatic 0.0–0.585 m, dq=±0.30 m/s, ddq=±1.0 m/s²
# J2-J4: ±90° (±1.5708 rad), dq=±1.5 rad/s, ddq=±4.0 rad/s²
# J5: ±180° (±3.14159 rad) — continuous rotation joint
# J6-J9: ±85° (±1.48353 rad)
# Python nineaxis_kinematics.py uses identical q_min/q_max;
# dq_max / ddq_max in Python are higher (3.14 rad/s / 31.4 rad/s²)
# reflecting actual motor specs; C++ uses conservative simulation limits.
joint_limits:
  q_min: [0.0, -1.5708, -1.5708, -1.5708, -3.14159, -1.48353, -1.48353, -1.48353, -1.48353]
  q_max: [0.585, 1.5708, 1.5708, 1.5708, 3.14159, 1.48353, 1.48353, 1.48353, 1.48353]
  dq_min: [-0.30, -1.5, -1.5, -1.5, -1.5, -1.5, -1.5, -1.5, -1.5]
  dq_max: [ 0.30,  1.5,  1.5,  1.5,  1.5,  1.5,  1.5,  1.5,  1.5]
  ddq_min: [-1.0, -4.0, -4.0, -4.0, -4.0, -4.0, -4.0, -4.0, -4.0]
  ddq_max: [ 1.0,  4.0,  4.0,  4.0,  4.0,  4.0,  4.0,  4.0,  4.0]
  tau_min: [-120, -80, -80, -60, -60, -40, -40, -25, -25]
  tau_max: [ 120,  80,  80,  60,  60,  40,  40,  25,  25]

simplified_model:
  link_lengths: [0.28, 0.32, 0.30, 0.26, 0.22, 0.20, 0.16, 0.12]
  diagonal_mass: [20.0, 8.0, 7.0, 5.0, 4.0, 3.0, 2.0, 1.5, 1.0]

