# MoveIt's OMPL pipeline with the project's AEB-RRT* PlannerManager.
#
# The plugin delegates PlanningScene collision checking to MoveIt's normal
# OMPL interface, then registers ``geometric::AEBRRTstarFaithful``.  This
# means both static and live ``/collision_object`` obstacles are checked by
# FCL during AEB-RRT* expansion and edge validation.
planning_plugin: aeb_rrtstar_ompl/AEBRRTstarPlannerManager
request_adapters: >-
  default_planner_request_adapters/AddRuckigTrajectorySmoothing
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.1

planner_configs:
  # Production default: paper-faithful AEB-RRT* (stop at the first valid
  # bidirectional connection).  These are the parameters exported by the
  # C++ planner through MoveIt's OMPL configuration interface.
  AEBRRTstarFaithfulConfigDefault:
    type: geometric::AEBRRTstarFaithful
    # Zero asks AEB-RRT* to derive its step and connection threshold from the
    # actual MoveIt joint-space extent (its safe, adaptive production mode).
    range: 0.0
    connect_threshold: 0.0
    stop_on_first_solution: true
    # Keep the AEB-generated route intact.  MoveIt's generic simplifier can
    # replace valid AEB edges with a shortcut that is later rejected by FCL.
    # MoveIt Humble reads these generic config flags with
    # boost::lexical_cast<bool>, which accepts 0/1 rather than true/false.
    simplify_solutions: "0"
    # Interpolate using the same conservative resolution used for motion
    # validation before MoveIt time-parameterizes and replays the path.
    interpolate: "1"
    longest_valid_segment_fraction: 0.001

  # Keep an explicit manual fallback available for diagnosis only.  Nothing
  # in the transition pipeline selects it by default.
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0

arm:
  planner_configs:
    - AEBRRTstarFaithfulConfigDefault
    - RRTConnectkConfigDefault
