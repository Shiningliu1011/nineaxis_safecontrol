# The input MAT file currently contains positions only. KDL therefore ignores
# the dummy orientation required by the GetPositionIK message; switch this to
# false only after the process/tool orientation is calibrated and supplied.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.5
  kinematics_solver_attempts: 50
  position_only_ik: true
