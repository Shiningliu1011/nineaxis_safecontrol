name: Pure software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install pure-check dependencies
        run: python3 -m pip install numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2 pytest==8.3.5
      # Compile, shell syntax, and pure contracts only. No ROS or device I/O.
      - name: Run fast checks
        run: bash scripts/agent_check.sh
