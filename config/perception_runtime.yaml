# Runtime configuration for the perception bridge + MuJoCo sim demo.
#
# Launch the camera first:
#   ros2 launch orbbec_camera gemini_330_series.launch.py \
#       depth_width:=640 depth_height:=480 depth_fps:=30 \
#       color_width:=640 color_height:=480 color_fps:=30 \
#       depth_registration:=true enable_colored_point_cloud:=true
#
# Then:
#   ros2 run robot_safecontrol_moveit perception_bridge
#   ros2 run robot_safecontrol_moveit perception_demo
#
# World frame is base_link: a fixed machine frame (Y-up: +Y vertical, +Z the
# horizontal J1 linear-rail direction, +X lateral).  The base is fixed in the
# work environment and J1 is the in-chain prismatic joint (q1), so base_link
# does not move with any joint (05B decision 2026-09-05).
#
# Calibration authority: config/sensor_extrinsics.yaml is the SINGLE source of
# truth for sensor->world matrices (ADR 0004), wired in by OFF-01/T7: this file
# no longer carries any calibration matrix, and the bridge loads the record via
# the ament share path.  The old keys (use_tf / camera_to_world_static /
# lidar_to_world_static) are gone from this file — the bridge still declares
# those three names purely as a tripwire, and refuses to start when a launch
# command passes a non-default value (two coexisting geometries are exactly the
# split-brain ADR 0004 exists to prevent).
#
# This is the SIM DEMO profile: the camera source is enabled while its record is
# still calibrated: false, so it declares the per-source debug exemption
# allow_uncalibrated_debug: [camera].  The exemption only allows startup — the
# source stays admission_ready: false and must not be used as something to admit
# avoidance on.  Drop the exemption once the real calibration lands.
#
# LiDAR is OFF by default (source_topic_lidar: "") to keep single-Camera
# behavior unchanged and until the calibration gate (T5/T6/T7) is passed; use
# config/perception_dual_sensor_real.yaml as the deployment template. Loading
# that file alone still leaves LiDAR OFF; enable its source topic only after
# the calibration gate and SSOT wiring have been implemented and verified.
#
# Keep workspace/voxel consistent with
# portable_oscbf/config/obstacle_params.yaml so the ESDF grid shape matches.

perception_bridge:
  ros__parameters:
    # --- Camera (Orbbec Gemini 335L) ---
    source_topic: /camera/depth_registered/points
    input_frame: camera_color_optical_frame
    # 外参不在这里：来自 config/sensor_extrinsics.yaml 的 camera 分节（当前是假定安装
    # 位姿 bx=cz, by=-cx, bz=-cy, t=[-0.9, 0.4, 1.7]，calibrated: false）。

    # --- LiDAR (Livox Mid-360S) ---
    # 默认关闭（保持单 Camera 行为 + calibration gate 未过不启用）。
    # 双传感器部署改载 config/perception_dual_sensor_real.yaml。
    # 驱动（注意：msg_MID360s_launch.py 的 xfer_format=0 才会发 PointCloud2，
    # frame_id 固定为 livox_frame）:
    #   source ~/livox_ws/install/setup.bash
    #   ros2 launch livox_ros_driver2 msg_MID360s_launch.py
    source_topic_lidar: ""
    input_frame_lidar: ""
    # 外参来自 sensor_extrinsics.yaml 的 lidar 分节（当前是占位单位阵，calibrated: false）。

    # --- World frame ---
    world_frame: base_link

    # --- Calibration record (SSOT) ---
    # 空 = 经 ament 解析 <share>/config/sensor_extrinsics.yaml 的唯一路径（生产路径）。
    # 只在调试/测试时填显式路径。
    calibration_record_path: ""
    # 逐源声明「本次部署允许未标定调试几何启动」。只影响能否启动，**不改变准入结论**：
    # 被豁免的源仍然 admission_ready: false。demo 需要相机在未标定时起步，故此处声明 camera。
    allow_uncalibrated_debug: [camera]
    # 逐源「实际生效」的时间域，只填你确实配置并确认过的值；未知留空 → 诊断报 unknown。
    # 不允许照抄驱动默认值（同样的默认值在不同机型/固件上语义不同）。
    source_time_domain_camera: ""
    source_time_domain_lidar: ""

    # --- Voxel sizes ---
    voxel_size: 0.03
    source_voxel_camera_m: 0.02
    source_voxel_lidar_m: 0.03
    fusion_voxel_m: 0.03

    # --- Freshness / fusion timing ---
    camera_max_age_s: 0.5
    lidar_max_age_s: 0.5
    max_inter_sensor_dt_s: 0.1
    occupancy_timeout_s: 0.3
    static_confirm_s: 0.5
    perception_timeout_s: 1.0

    # --- Point cloud processing ---
    max_points: 5000
    point_radius: 0.01
    safety_margin: 0.08
    workspace_min: [-0.9, -0.2, -0.6]
    workspace_max: [0.9, 0.8, 2.0]
    sdf_far_distance: 10.0
    static_occupancy_frames: 8

    # --- Clustering ---
    cluster_max_tracks: 8
    cluster_min_points: 4
    cluster_association_max_dist_m: 0.5

    # --- Publishing rates ---
    publish_cloud_rate_hz: 5.0
    publish_esdf_rate_hz: 10.0
    publish_collision_rate_hz: 5.0
    collision_object_prefix: camera_cluster

perception_demo:
  ros__parameters:
    control_dt_s: 0.002
    render_hz: 60.0
    sdf_margin: 0.08
    trajectory_mat: ""
    joint_names: [J1, J2, J3, J4, J5, J6, J7, J8, J9]
    # Obstacle slots default: disabled until the first /perception/tracks frame.
    enable_dynamic_slots: true
