# === DUAL-SENSOR REAL PROFILE (OPT-IN, 默认 INERT) ===
#
# 本 profile **默认不启用 LiDAR**（source_topic_lidar = ""）——即使直接作为
# params-file 加载，节点也只会订阅相机、行为等价于单相机运行，**不会**出现
# 用占位/假定外参跑双传感器的静默错误。
#
# 启用 LiDAR 的真实前提（全部满足，任何一条不满足都不得修改本段）:
#   1. T5 两段式标定完成，sensor_extrinsics.yaml 含带 provenance 的
#      T_lidar^base / T_cam^base（calibrated: true）;
#   2. T7 标定 SSOT 接线完成：bridge/launch 经 ament share 解析唯一
#      config/sensor_extrinsics.yaml 路径并加载，本文件**不再携带任何
#      calibration matrix**，外参全部由 sensor_extrinsics.yaml 提供;
#   3. 代码级 gate（T7/T6）：启动时 fail-fast 校验数学合法性 + 标定状态 +
#      已知物体 20mm 验收，失败即拒绝进入避障模式（ADR 0003/0004）。
#      注释/文件名不是 gate——gate 必须是代码，验证未落地前不得启用。
#
# 使用方式:
#   ros2 run robot_safecontrol_moveit perception_bridge \
#       --ros-args --params-file config/perception_dual_sensor_real.yaml
#   当前状态下运行 = 单相机（LiDAR 段为空），与 perception_runtime.yaml 等价;
#   T5/T6/T7 全部落地后才允许把下方 source_topic_lidar 改为 /livox/lidar。

perception_bridge:
  ros__parameters:
    # --- Camera (Orbbec Gemini 335L) ---
    source_topic: /camera/depth_registered/points
    input_frame: camera_color_optical_frame
    # 假定安装位姿（无标定 provenance，05A）: bx=cz, by=-cx, bz=-cy, t=[-0.9, 0.4, 1.7]
    camera_to_world_static: [0.0, 0.0, 1.0, -0.9, -1.0, 0.0, 0.0, 0.4, 0.0, -1.0, 0.0, 1.7, 0.0, 0.0, 0.0, 1.0]

    # --- LiDAR (Livox Mid-360S) — 默认 INERT，见头部说明 ---
    # 保持为空！启用条件见头部前提 1-3；T7 后外参改由
    # config/sensor_extrinsics.yaml（唯一真源）提供，本文件只留 topic/frame。
    source_topic_lidar: ""
    input_frame_lidar: ""

    # --- World frame ---
    world_frame: base_link
    use_tf: false

    # --- Voxel sizes ---
    voxel_size: 0.03
    source_voxel_camera_m: 0.02
    source_voxel_lidar_m: 0.03
    fusion_voxel_m: 0.03

    # --- Freshness / fusion timing ---
    camera_max_age_s: 0.5
    lidar_max_age_s: 0.5
    max_inter_sensor_dt_s: 0.1
    occupancy_timeout_s: 0.3
    static_confirm_s: 0.5
    # PROVISIONAL (05B post-review): 最终值由 #10 陈旧数据模型结算。
    perception_timeout_s: 1.0

    # --- Point cloud processing ---
    max_points: 5000
    point_radius: 0.01
    safety_margin: 0.08
    workspace_min: [-0.9, -0.2, -0.6]
    workspace_max: [0.9, 0.8, 2.0]
    sdf_far_distance: 10.0
    static_occupancy_frames: 8

    # --- Clustering ---
    cluster_max_tracks: 8
    cluster_min_points: 4
    cluster_association_max_dist_m: 0.5

    # --- Publishing rates ---
    publish_cloud_rate_hz: 5.0
    publish_esdf_rate_hz: 10.0
    publish_collision_rate_hz: 5.0
    collision_object_prefix: camera_cluster

perception_demo:
  ros__parameters:
    control_dt_s: 0.002
    render_hz: 60.0
    sdf_margin: 0.08
    trajectory_mat: ""
    joint_names: [J1, J2, J3, J4, J5, J6, J7, J8, J9]
    # Obstacle slots default: disabled until the first /perception/tracks frame.
    enable_dynamic_slots: true
