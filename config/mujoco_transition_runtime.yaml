# Runtime configuration for MuJoCo manual mode + MoveIt transition planning.
#
# Single launch command:
#   ros2 launch robot_safecontrol_moveit mujoco_transition_final.launch.py
#
# The transition_result_mode must be one of: plan_only, joint_state_replay, moveit_execute.
# Set to joint_state_replay to see the robot move in MuJoCo after pressing T.

mujoco_joint_state_viewer:
  ros__parameters:
    joint_state_topic: /mujoco_joint_states
    show_target_path: true
    show_tracking_cylinder: true

transition_planning_server:
  ros__parameters:
    joint_state_topic: /mujoco_joint_states
    replay_joint_state_topic: /mujoco_joint_states
    allow_joint_state_fallback: false
    joint_state_timeout_s: 3.0
    max_joint_state_age_s: 1.0

    planning_group: arm
    base_frame: base_link
    tool_link: tool0

    trajectory_offset_m: [0.0, 0.343, 1.587]

    orientation_xyzw: [0.0, 0.0, 0.0, 1.0]

    align_tool_x_to_surface_normal: true
    cylinder_axis_direction: [0.0, 1.0, 0.0]

    ik_service_timeout_s: 5.0

    planning_pipeline: ompl
    planner_id: AEBRRTstarFaithfulConfigDefault
    planning_time_s: 10.0
    # One faithful AEB-RRT* planner instance; avoid ParallelPlan hybrids.
    planning_attempts: 1

    # Must be one of: plan_only, joint_state_replay, moveit_execute
    transition_result_mode: joint_state_replay
    # 100 Hz: replayed 轨迹按 time_from_start 插值重采样, 提高过渡平滑度
    replay_rate_hz: 100.0
    # 过渡时间剖面放大倍数: 大行程过渡不再 1 秒疾驰 (观感甩动)
    replay_time_scale: 3.0
    # 最短过渡回放时长: 即便规划出的轨迹本身只有 <1s 也至少从容播放 4s
    replay_min_duration_s: 4.0
    # Full OSCBF flow: the replay also drives the actuator plant, and the
    # controller is told to start tracking once the transition completes.
    oscbf_command_topic: /oscbf_command
    notify_oscbf_start: true
    auto_plan_once: true
    auto_plan_attempts: 5
    oscbf_plant_randomize_service: /oscbf_plant/randomize
