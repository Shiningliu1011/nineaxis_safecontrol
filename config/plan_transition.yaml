plan_transition:
  ros__parameters:
    # Full trajectory with visible (slow) replay.
    max_points: 50
    point_stride: 1
    use_current_state: true
    # Which topic to read the current joint state from.
    # Set to /mujoco_joint_states when using the MuJoCo Viewer in manual mode.
    # Set to /joint_states when using ros2_control's JointStateBroadcaster.
    joint_state_topic: /mujoco_joint_states
    wait_for_current_state_timeout_s: 3.0
    max_joint_state_age_s: 1.0
    wait_for_scene_timeout_s: 3.0
    # MoveIt OMPL pipeline, with AEB-RRT* registered by the project plugin.
    planning_pipeline: ompl
    planner_id: AEBRRTstarFaithfulConfigDefault
    planning_time_s: 10.0
    planning_attempts: 1
    velocity_scale: 0.2
    acceleration_scale: 0.2
    max_joint_delta: 0.15
    # Safety: execute_transition defaults to false.
    # Set to true only after verifying the plan in RViz.
    execute_transition: false
    execute_task_path: false
    dry_run: true
    replay_rate_hz: 2.0
    # Orient tool0 X-axis to cylinder surface normal at each waypoint.
    align_tool_x_to_surface_normal: true
    cylinder_axis_direction: [0.0, 1.0, 0.0]
