# DrEmpower 电机通信配置（真机）。
# 来源：协议摘要（real_robot_hardware_source_review.md）+ 选型手册。
# 本地厂家 v1.0 已核验字节布局，实际固件/单位回读仍待现场确认。
# hardware_check 只消费 can/node_ids；其余候选参数未接入 live bridge。

/**:
  ros__parameters:
    can:
      interface: can0              # SocketCAN 接口名（适配器驱动/接口名待确认）
      bitrate: 1000000             # 1 Mbps（厂商默认）

    node_ids:                      # 推荐分配，待前置 P5 实读确认
      J1: 1
      J2: 2
      J3: 3
      J4: 4
      J5: 5
      J6: 6
      J7: 7
      J8: 8
      J9: 9

    # 命令参数（0x19 帧字段，待 P1 厂商库确认单位后锁定）
    command:
      default_speed: 1.0           # mode0 最大速度 rpm（候选，非已验收）
      default_filter_accel: 1.0    # mode0 输入滤波带宽（历史字段名，非加速度）

    # 安全网关参数（参考项目硬件合同，待实测调整）
    safety:
      feedback_timeout_s: 0.2      # 反馈超时
      command_timeout_s: 0.2       # 命令超时
      velocity_limit: 3.0          # 速度上限（rad/s 或 m/s，未标定前用仿真值）
      dq_limit: 0.01               # 相邻命令变化上限（rad 或 m）

    # 轮询
    poll:
      frequency_hz: 100.0          # 与仿真一致
