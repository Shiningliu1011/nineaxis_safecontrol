# oscbf_controller node parameters (M10).
#
# This file is the authoritative production profile.  The controller refuses
# to start if it is absent, malformed, incomplete, or invalid.  Launch/CLI
# overrides are applied only after this complete base has passed validation.
# Empty resource paths independently resolve against the package share.
/**:
  ros__parameters:
    dt: 0.01
    # 路径推进采用 20 ms 控制周期；QP 积分保持 10 ms 数值步长。
    dt_path: 0.02
    publish_frequency_hz: 50.0
    trajectory_mat: ""                     # default: <share>/data/nurbs/ik_input.mat
    portable_oscbf_root: ""                # default: <share>/portable_oscbf
    # Root-only overrides deliberately do not redirect this fallback.
    portable_config_yaml: ""               # default: <share>/portable_oscbf/config/nineaxis.yaml
    joint_names: ["J1", "J2", "J3", "J4", "J5", "J6", "J7", "J8", "J9"]
    joint_state_topic: /mujoco_joint_states
    publish_joint_state_topic: /oscbf_command
    kp_pos: 240.0
    kp_orient: 40.0
    kp_joint: 0.45
    # 工具轴角速度上限: 曲率段进给被压到 0.03-0.08 m/s 的主因, 从 0.6 提到
    # 2.0 使 nominal 进给 (feedrate_scale=8.0) 成为实际限额。
    max_tool_axis_speed_rad_s: 2.0
    # 源数据 feedrate 按旧 tool-axis 限速生成 (~0.04 m/s), 运行时放大整体提速
    reference_feedrate_scale: 3.5
    nullspace_speed_limit: 0.18
    # DLS 阻尼限制小奇异值方向上的关节速度放大量。
    damping: 0.05
    w_pos: 40.0
    w_orient: 10.0
    w_joint: 0.1
    temporal_lambda: 0.2
    enable_x64: true
    solver_tol: 0.001
    # 工具 X 轴跟随当前位置在路径上的投影点法向；绕工具轴转动保持自由。
    task_mode: tool_axis_5d
    # Null-space posture.  The deployed default keeps the null-space velocity
    # at zero (q_des tracks the measured state): the 5-D task leaves enough
    # redundancy that the butterfly can complete without extra reconfiguration.
    # The manipulability-gradient policy (M8) can drive joints toward their
    # limits on the butterfly loops and trip the joint-limit CBF feedrate
    # cap; it remains available as an opt-in pending limit-aware
    # regularisation.
    use_nullspace_policy: false
    reference_lead_m: 0.002
    orientation_mode: surface_normal
    cylinder_axis_direction: [0.0, 1.0, 0.0]
    # 0 表示使用路径拟合半径；静态实验通过统一配置指定路径圆柱半径。
    path_radius_m: 0.0
    # One point on the cylinder axis.  Omitted here = fit from the trajectory
    # itself (same convention as the transition planner and MuJoCo viewer).
    # To pin an explicit axis point, set e.g. cylinder_center: [-0.0001, 0.0, 1.637]
    wait_for_start: false
    enable_perception_obstacles: false
    perception_tracks_topic: /perception/tracks
    telemetry_period_s: 1.0
    perf_report_path: output/oscbf_m10_perf.md
    latency_budget_ms: 20.0
